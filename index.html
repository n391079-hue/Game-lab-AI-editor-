<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameForge Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">

    <div class="logo">
        🎮 GameForge
    </div>

    <div class="project-name">
        My First Game
    </div>

    <div class="top-actions">
        <button id="saveBtn">💾 Save</button>
        <button id="playBtn">▶ Play</button>
    </div>

</header>


<div class="workspace">

    <!-- LEFT PANEL -->

    <aside class="left-panel">

        <h3>Objects</h3>

        <button class="object-btn" data-type="player">
            🧍 Player
        </button>

        <button class="object-btn" data-type="platform">
            🟫 Platform
        </button>

        <button class="object-btn" data-type="enemy">
            👾 Enemy
        </button>

        <button class="object-btn" data-type="coin">
            🪙 Coin
        </button>

        <button class="object-btn" data-type="goal">
            🏁 Goal
        </button>


        <h3>Tools</h3>

        <button id="deleteBtn">
            🗑 Delete Selected
        </button>

        <button id="clearBtn">
            🔄 Clear Scene
        </button>

    </aside>


    <!-- CANVAS -->

    <main class="editor">

        <div class="editor-toolbar">

            <button id="zoomOut">−</button>

            <span id="zoomText">100%</span>

            <button id="zoomIn">+</button>

            <span class="hint">
                Click object → drag to move
            </span>

        </div>

        <div class="canvas-area">

            <canvas id="gameCanvas"
                    width="1000"
                    height="600">
            </canvas>

        </div>

    </main>


    <!-- RIGHT PANEL -->

    <aside class="right-panel">

        <h3>Properties</h3>

        <div id="properties">

            <p class="empty">
                Select an object
            </p>

        </div>


        <hr>


        <h3>Events</h3>

        <div class="event">

            <select id="condition">
                <option>Player collides with Coin</option>
                <option>Player collides with Enemy</option>
                <option>Player reaches Goal</option>
                <option>Every frame</option>
            </select>

            <span>→</span>

            <select id="action">
                <option>Add Score</option>
                <option>Destroy Object</option>
                <option>Restart Scene</option>
                <option>Win Game</option>
            </select>

            <button id="addEvent">
                + Add
            </button>

        </div>


        <div id="eventList"></div>

    </aside>

</div>


<script src="app.js"></script>

</body>
  </html>
